name: Demo Badge

# NOTE: TryHackMe's API is behind Vercel bot mitigation that challenges every
# datacenter IP, so GitHub-hosted runners can no longer fetch the profile. The
# demo badge (assets/demo.svg) is refreshed from a residential machine instead
# (see scripts/refresh-badges.sh + the launchd agent). This workflow is kept for
# manual runs only and will fail on a cloud runner.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-badge
  cancel-in-progress: false

jobs:
  demo:
    name: Refresh the demo badge in the README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run the action against itself (dogfood)
        uses: ./
        with:
          username: Keizer
          output_path: assets/demo.svg
          theme: rotate
          commit_message: 'chore: refresh demo badge'
